<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>SwagTix Mobile</title>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #7B5BFF 0%, #FF3D8A 100%);
      color: white;
      z-index: 9999;
    }
    
    #loading img {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
    }
    
    #loading p {
      font-size: 18px;
      margin: 10px 0;
    }
    
    #wallet-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="assets/logo.png" alt="SwagTix Logo">
    <p>Loading SwagTix Wallet...</p>
    <div class="spinner"></div>
  </div>
  
  <iframe id="wallet-frame" src="about:blank"></iframe>
  
  <script src="cordova.js"></script>
  <script>
    document.addEventListener('deviceready', onDeviceReady, false);
    
    function onDeviceReady() {
      console.log('Device is ready');
      
      // Set iframe source to wallet URL
      const walletFrame = document.getElementById('wallet-frame');
      const walletUrl = 'http://your-wallet-url.com'; // Replace with actual wallet URL
      
      walletFrame.src = walletUrl;
      
      walletFrame.onload = function() {
        console.log('Wallet frame loaded');
        
        // Hide loading screen after a short delay
        setTimeout(() => {
          document.getElementById('loading').style.display = 'none';
        }, 1000);
      };
      
      // Handle back button for Android
      document.addEventListener('backbutton', handleBackButton, false);
    }
    
    function handleBackButton(e) {
      const walletFrame = document.getElementById('wallet-frame');
      
      // Try to go back in the iframe if possible
      if (walletFrame.contentWindow && walletFrame.contentWindow.history.length > 1) {
        walletFrame.contentWindow.history.back();
        e.preventDefault();
      } else {
        // Ask if the user wants to exit the app
        navigator.notification.confirm(
          'Do you want to exit the app?',
          function(buttonIndex) {
            if (buttonIndex === 2) {
              navigator.app.exitApp();
            }
          },
          'Exit App',
          ['Cancel', 'Exit']
        );
        e.preventDefault();
      }
    }
  </script>
</body>
</html>
